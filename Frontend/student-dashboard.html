<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Dashboard</title>

  <link rel="stylesheet" href="./css/student.css">

</head>

<body>

  <!-- Navbar -->

  <div class="navbar">

    <h2>Student Dashboard</h2>

    <button class="logout-btn">
      Logout
    </button>

  </div>

  <!-- Main Container -->

  <div class="container">

    <!-- Welcome Section -->

    <div class="welcome-card">

   <h1>

      Welcome,

      <span id="studentName"></span>

   </h1>

   <p>
      View your attendance details below
   </p>

   <p>

      Roll Number:

      <span id="studentRoll"></span>

   </p>

</div>

    <!-- Summary Cards -->

    <div class="summary-section">

      <div class="card">

        <h3>Total Classes</h3>

        <p id="totalClasses">0</p>

      </div>

      <div class="card">

        <h3>Present</h3>

        <p id="presentClasses">0</p>

      </div>

      <div class="card">

        <h3>Absent</h3>

        <p id="absentClasses">0</p>

      </div>

      <div class="card">

        <h3>Overall Attendance</h3>

        <p id="overallAttendance">0%</p>

      </div>

    </div>

    <!-- Charts Section -->

<div class="chart-container">

   <div class="chart-card">

      <h2>
         Attendance Overview
      </h2>

      <canvas id="pieChart">

      </canvas>

   </div>

   <div class="chart-card">

      <h2>
         Subject Wise Attendance
      </h2>

      <canvas id="barChart">

      </canvas>

   </div>

</div>

    <!-- Attendance Table -->

    <div class="table-container">

      <h2>Subject Wise Attendance</h2>

      <table>

        <thead>

          <tr>

              <th>Subject</th>

              <th>Status</th>

              <th>Date</th>

          </tr>

        </thead>

        <tbody id="attendanceTable">

         </tbody>

      </table>

    </div>

  </div>
<script src="./js/student.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
